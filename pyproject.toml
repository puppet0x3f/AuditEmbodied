[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditembodied"
version = "0.1.0"
description = "Oracle-gated bimanual handover and physical recovery experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "mujoco==3.3.7",
  "robosuite==1.5.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "h5py>=3.11,<4",
  "matplotlib>=3.8,<3.11",
]

[project.scripts]
ae-l0 = "auditembodied.l0:main"
ae-smoke = "auditembodied.smoke:main"
ae-trajectory = "auditembodied.continuous:main"
ae-r1-scan = "auditembodied.continuous:main"
ae-l1 = "auditembodied.l1:main"
ae-l1-calibrate = "auditembodied.l1:calibration_main"
ae-l2 = "auditembodied.temporal:main"
ae-l2-ablation = "auditembodied.l2_ablation:main"

[tool.setuptools.packages.find]
include = ["auditembodied*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
